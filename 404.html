<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 — Página não encontrada</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #050505;
      color: #fff;
      font-family: Arial, sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;

      overflow: hidden;
    }

    .container {
      max-width: 600px;
      padding: 30px;
    }

    .error {
      font-size: clamp(100px, 20vw, 220px);
      font-weight: 900;
      line-height: 0.8;
      letter-spacing: -15px;

      color: transparent;
      -webkit-text-stroke: 2px #fff;
    }

    h1 {
      margin-top: 40px;
      font-size: 28px;
    }

    p {
      margin-top: 15px;
      color: #888;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 30px;
      padding: 14px 24px;

      background: #fff;
      color: #000;

      text-decoration: none;
      font-weight: bold;

      transition: 0.2s;
    }

    a:hover {
      transform: translateY(-3px);
    }

    .terminal {
      margin-top: 35px;
      padding: 15px;
      border: 1px solid #222;

      color: #777;
      font-family: monospace;
      text-align: left;
      font-size: 13px;
    }

    .green {
      color: #00ff88;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="error">404</div>

    <h1>Página não encontrada.</h1>

    <p>
      Parece que você tentou acessar uma rota que não existe.
      Talvez ela tenha sido movida ou nunca tenha existido.
    </p>

    <div class="terminal">
      <span class="green">ian@portfolio:~$</span> locate page<br>
      ERROR: page not found_
    </div>

    <a href="/">Voltar para o início</a>

  </main>

</body>
</html>
